# permissions for end users to view cacheclusters.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: kubebuilder-template
    app.kubernetes.io/managed-by: kustomize
  name: cachecluster-viewer-role
rules:
- apiGroups:
  - cache.example.com
  resources:
  - cacheclusters
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - cache.example.com
  resources:
  - cacheclusters/status
  verbs:
  - get
